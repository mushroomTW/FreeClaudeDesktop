name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release 版本，例如 v0.1.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: 驗證 Release 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: 設定 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: 驗證 SemVer
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "版本必須使用 v 開頭的 SemVer，例如 v0.1.2"
            exit 1
          fi

      - name: 驗證 npm 套件版本
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          package_version="$(bun -p "require('./packages/freeclaudedesktop/package.json').version")"
          release_version="${RELEASE_VERSION#v}"
          if [[ "$package_version" != "$release_version" ]]; then
            echo "npm 套件版本 $package_version 與 Release 版本 $release_version 不一致"
            exit 1
          fi

  build:
    name: 建置 ${{ matrix.label }} npm binary 套件
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: Linux ARM64
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            label: macOS Intel x64
            target: x86_64-apple-darwin
          - os: macos-15
            label: macOS ARM64
            target: aarch64-apple-darwin
          - os: windows-latest
            label: Windows x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            label: Windows ARM64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: 安裝 Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal

      - name: 使用 Rust 1.99.0
        run: rustup override set 1.99.0

      - name: 建置 FreeClaudeDesktop binary
        run: cargo build --locked --release --package freeclaude --package freeclaude-proxy

      - name: 設定 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: 安裝 JavaScript workspace
        run: bun install --frozen-lockfile

      - name: 驗證 Bun 包裝器與套件
        run: bun test

      - name: 建立平台 npm binary 套件
        shell: bash
        run: bun run pack:platform "${{ matrix.target }}"

      - name: 打包平台 npm binary 套件
        shell: bash
        run: |
          package_dir="$(find dist/npm -mindepth 1 -maxdepth 1 -type d -name 'freeclaudedesktop-*' -print -quit)"
          bun pm pack --cwd "$package_dir" --destination ..

      - name: 驗證平台發行套件
        env:
          # Bun 1.4.3 的 dry-run 仍要求認證欄位；占位值不會送出發布請求。
          NPM_CONFIG_TOKEN: dry-run-placeholder
        shell: bash
        run: |
          archive="$(find dist/npm -maxdepth 1 -type f -name '*.tgz' -print -quit)"
          bun scripts/verify-package.mjs "$archive" "${{ matrix.target }}"
          bun publish "./$archive" --access public --dry-run

      - name: 上傳 npm binary 套件
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          path: dist/npm/mushroomtw-freeclaudedesktop-*-*.tgz
          if-no-files-found: error

  publish:
    name: 發布 npm 套件與 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: 下載 npm binary 套件
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 設定 Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - name: 打包與驗證主套件
        env:
          NPM_CONFIG_TOKEN: dry-run-placeholder
        shell: bash
        run: |
          mkdir -p dist/npm/main
          bun pm pack --cwd packages/freeclaudedesktop --destination ../../dist/npm/main
          bun scripts/verify-package.mjs dist/npm/main/*.tgz
          bun publish ./dist/npm/main/*.tgz --access public --dry-run

      - name: 發布 npm 套件
        env:
          NPM_CONFIG_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for archive in dist/mushroomtw-freeclaudedesktop-*-*.tgz; do
            bun publish "./$archive" --access public --registry https://registry.npmjs.org --tolerate-republish
          done
          bun publish ./dist/npm/main/*.tgz --access public --registry https://registry.npmjs.org --tolerate-republish

      - name: 建立 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_VERSION 已存在，略過建立步驟"
          else
            gh release create "$RELEASE_VERSION" \
              --target "$GITHUB_SHA" \
              --title "FreeClaudeDesktop $RELEASE_VERSION" \
              --generate-notes
          fi
