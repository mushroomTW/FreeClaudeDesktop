name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 建置 ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: tar.gz
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            archive: tar.gz
          - os: macos-13
            target: x86_64-apple-darwin
            archive: tar.gz
          - os: macos-14
            target: aarch64-apple-darwin
            archive: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: zip
          - os: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: 安裝 Rust 工具鏈
        run: rustup toolchain install 1.97.0 --profile minimal

      - name: 使用 Rust 1.97.0
        run: rustup override set 1.97.0

      - name: 建置發行檔
        run: cargo build --locked --release --package freeclaude --package freeclaude-proxy

      - name: 設定 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: 建立目前平台的 pnpm binary 套件
        shell: bash
        run: node scripts/pack-platform.mjs "${{ matrix.target }}"

      - name: 打包目前平台的 pnpm binary 套件
        shell: bash
        run: |
          package_dir="$(find dist/npm -mindepth 1 -maxdepth 1 -type d -name 'freeclaudedesktop-*' -print -quit)"
          pnpm --dir "$package_dir" pack --pack-destination ..

      - name: 打包 Unix 發行檔
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist/package
          cp target/release/freeclaude target/release/freeclaude-proxy dist/package/
          tar -C dist/package -czf "../freeclaude-${{ matrix.target }}.tar.gz" freeclaude freeclaude-proxy

      - name: 打包 Windows 發行檔
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/package | Out-Null
          Copy-Item target/release/freeclaude.exe, target/release/freeclaude-proxy.exe dist/package/
          Compress-Archive -Path dist/package/* -DestinationPath "dist/freeclaude-${{ matrix.target }}.zip"

      - name: 上傳發行檔
        uses: actions/upload-artifact@v7
        with:
          name: freeclaude-${{ matrix.target }}
          path: dist/freeclaude-${{ matrix.target }}.${{ matrix.archive }}
          if-no-files-found: error

      - name: 上傳 pnpm binary 套件
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          path: dist/npm/mushroomtw-freeclaudedesktop-*-*.tgz
          if-no-files-found: error

  publish:
    name: 建立 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v7

      - name: 下載全部發行檔
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 設定 Node.js
        if: github.ref_type == 'tag' && env.HAS_NPM_TOKEN == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 設定 pnpm
        if: github.ref_type == 'tag' && env.HAS_NPM_TOKEN == 'true'
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: 發佈 pnpm 套件
        if: github.ref_type == 'tag' && env.HAS_NPM_TOKEN == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          for archive in dist/mushroomtw-freeclaudedesktop-*-*.tgz; do
            pnpm publish "$archive" --access public --no-git-checks
          done
          mkdir -p dist/npm/main
          pnpm --dir packages/freeclaudedesktop pack --pack-destination ../../dist/npm/main
          pnpm publish dist/npm/main/*.tgz --access public --no-git-checks

      - name: 準備安裝器與校驗檔
        shell: bash
        run: |
          cp scripts/install.sh dist/install.sh
          cp scripts/install.ps1 dist/install.ps1
          cd dist
          sha256sum freeclaude-*.tar.gz freeclaude-*.zip > checksums.txt

      - name: 建立 Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" != "tag" ]]; then
            echo "手動觸發只建置資產，不建立 Release。"
            exit 0
          fi
          gh release create "${{ github.ref_name }}" dist/* \
            --verify-tag \
            --title "FreeClaudeDesktop ${{ github.ref_name }}" \
            --generate-notes
