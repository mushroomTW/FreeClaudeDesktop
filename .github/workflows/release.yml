name: Release

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      release_tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"

  windows:
    name: Windows MSI and portable ZIP
    needs: prepare
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: windows-release
          cache-on-failure: true
      - name: Build release executable
        run: cargo build --release --locked
      - name: Install cargo-wix
        run: cargo install cargo-wix --version 0.3.9 --locked
      - name: Locate WiX Toolset 3
        id: wix
        shell: pwsh
        run: |
          $candle = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3.*\bin\candle.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $candle) { throw 'GitHub Windows runner does not provide WiX Toolset 3.' }
          "bin=$($candle.DirectoryName)" >> $env:GITHUB_OUTPUT
      - name: Build MSI and portable ZIP
        shell: pwsh
        run: |
          $version = '${{ needs.prepare.outputs.version }}'
          New-Item -ItemType Directory -Force dist, portable | Out-Null
          cargo wix --no-build --nocapture --bin-path "${{ steps.wix.outputs.bin }}" --output "dist/FreeClaudeDesktop-v$version-windows-x86_64.msi"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item target/release/FreeClaudeDesktop.exe, README.md, README_zh.md -Destination portable
          Compress-Archive -Path portable/* -DestinationPath "dist/FreeClaudeDesktop-v$version-windows-x86_64-portable.zip"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
      - name: Create provenance bundles
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            $predicate = Join-Path $env:RUNNER_TEMP "$($_.Name).provenance.json"
            @{ buildType = 'https://github.com/mushroomTW/FreeClaudeDesktop/.github/workflows/release.yml'; invocation = @{ configSource = @{ uri = "git+https://github.com/$env:GITHUB_REPOSITORY@$env:GITHUB_SHA" } } } | ConvertTo-Json -Depth 5 | Set-Content -NoNewline $predicate
            cosign attest-blob --yes --predicate $predicate --type https://slsa.dev/provenance/v1 --bundle "$($_.FullName).bundle" $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error

  linux:
    name: Linux DEB and portable archive
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: linux-release
          cache-on-failure: true
      - name: Install Linux build dependencies
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libayatana-appindicator3-dev libxdo-dev
      - name: Build release binary
        run: cargo build --release --locked
      - name: Install cargo-deb
        run: cargo install cargo-deb --version 3.7.0 --locked
      - name: Build DEB and portable archive
        run: |
          set -euo pipefail
          version='${{ needs.prepare.outputs.version }}'
          mkdir -p dist portable
          cargo deb --locked --no-build --output "dist/FreeClaudeDesktop-v${version}-linux-x86_64.deb"
          cp target/release/FreeClaudeDesktop README.md README_zh.md portable/
          tar -C portable -czf "dist/FreeClaudeDesktop-v${version}-linux-x86_64.tar.gz" .
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
      - name: Create provenance bundles
        run: |
          set -euo pipefail
          for asset in dist/*; do
            predicate="$RUNNER_TEMP/$(basename "$asset").provenance.json"
            jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" '{buildType:"https://github.com/mushroomTW/FreeClaudeDesktop/.github/workflows/release.yml",invocation:{configSource:{uri:("git+https://github.com/" + $repo + "@" + $sha)}}}' > "$predicate"
            cosign attest-blob --yes --predicate "$predicate" --type https://slsa.dev/provenance/v1 --bundle "$asset.bundle" "$asset"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: linux-release
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS Universal 2 DMG
    needs: prepare
    runs-on: macos-14
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88
        with:
          toolchain: stable
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae
        with:
          shared-key: macos-universal-release
          cache-on-failure: true
      - name: Build Universal 2 DMG
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          version='${{ needs.prepare.outputs.version }}'
          app="$RUNNER_TEMP/FreeClaudeDesktop.app"
          iconset="$RUNNER_TEMP/FreeClaudeDesktop.iconset"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" "$iconset" dist
          lipo -create target/aarch64-apple-darwin/release/FreeClaudeDesktop target/x86_64-apple-darwin/release/FreeClaudeDesktop -output "$app/Contents/MacOS/FreeClaudeDesktop"
          cp packaging/macos/Info.plist "$app/Contents/Info.plist"
          sed -i '' "s/__VERSION__/$version/g" "$app/Contents/Info.plist"
          for size in 16 32 128 256 512; do
            doubled=$((size * 2))
            sips -z "$size" "$size" assets/linux/freeclaudedesktop.png --out "$iconset/icon_${size}x${size}.png" >/dev/null
            sips -z "$doubled" "$doubled" assets/linux/freeclaudedesktop.png --out "$iconset/icon_${size}x${size}@2x.png" >/dev/null
          done
          iconutil -c icns "$iconset" -o "$app/Contents/Resources/FreeClaudeDesktop.icns"
          hdiutil create -volname FreeClaudeDesktop -srcfolder "$app" -ov -format UDZO "dist/FreeClaudeDesktop-v${version}-macos-universal.dmg"
      - uses: sigstore/cosign-installer@f713795cb21599bc4e5c4b58cbad1da852d7eeb9
      - name: Create provenance bundle
        run: |
          set -euo pipefail
          asset="$(find dist -type f -name '*.dmg' -print -quit)"
          predicate="$RUNNER_TEMP/$(basename "$asset").provenance.json"
          jq -n --arg repo "$GITHUB_REPOSITORY" --arg sha "$GITHUB_SHA" '{buildType:"https://github.com/mushroomTW/FreeClaudeDesktop/.github/workflows/release.yml",invocation:{configSource:{uri:("git+https://github.com/" + $repo + "@" + $sha)}}}' > "$predicate"
          cosign attest-blob --yes --predicate "$predicate" --type https://slsa.dev/provenance/v1 --bundle "$asset.bundle" "$asset"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: macos-release
          path: dist/*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [prepare, windows, linux, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          path: release-assets
          merge-multiple: true
      - name: Generate checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | xargs sha256sum > SHA256SUMS.txt
      - name: Publish or update release
        working-directory: release-assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.release_tag }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            tag_ref="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG")"
            tag_sha="$(jq -r '.object.sha' <<<"$tag_ref")"
            tag_type="$(jq -r '.object.type' <<<"$tag_ref")"
            if [ "$tag_type" = "tag" ]; then
              tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$tag_sha" --jq '.object.sha')"
            fi
            if [ "$tag_sha" != "$GITHUB_SHA" ]; then
              echo "Release $TAG already points to $tag_sha, not $GITHUB_SHA. Refusing to replace assets from a different commit." >&2
              exit 1
            fi
            gh release upload "$TAG" ./* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" ./* --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --generate-notes --title "FreeClaudeDesktop $TAG"
          fi
