name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release 版本，例如 v0.1.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  validate:
    name: 驗證 Release 版本
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 驗證 SemVer
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "版本必須使用 v 開頭的 SemVer，例如 v0.1.2"
            exit 1
          fi

      - name: 驗證 npm 套件版本
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        shell: bash
        run: |
          package_version="$(node -p "require('./packages/freeclaudedesktop/package.json').version")"
          release_version="${RELEASE_VERSION#v}"
          if [[ "$package_version" != "$release_version" ]]; then
            echo "npm 套件版本 $package_version 與 Release 版本 $release_version 不一致"
            exit 1
          fi

  build:
    name: 建置 ${{ matrix.label }} npm binary 套件
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: Linux x64
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            label: Linux ARM64
            target: aarch64-unknown-linux-gnu
          - os: macos-15-intel
            label: macOS Intel x64
            target: x86_64-apple-darwin
          - os: macos-15
            label: macOS ARM64
            target: aarch64-apple-darwin
          - os: windows-latest
            label: Windows x64
            target: x86_64-pc-windows-msvc
          - os: windows-11-arm
            label: Windows ARM64
            target: aarch64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: 安裝 Rust toolchain
        run: rustup toolchain install 1.97.1 --profile minimal

      - name: 使用 Rust 1.97.1
        run: rustup override set 1.97.1

      - name: 建置 FreeClaudeDesktop binary
        run: cargo build --locked --release --package freeclaude --package freeclaude-proxy

      - name: 設定 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: 建立平台 npm binary 套件
        shell: bash
        run: node scripts/pack-platform.mjs "${{ matrix.target }}"

      - name: 打包平台 npm binary 套件
        shell: bash
        run: |
          package_dir="$(find dist/npm -mindepth 1 -maxdepth 1 -type d -name 'freeclaudedesktop-*' -print -quit)"
          pnpm --dir "$package_dir" pack --pack-destination ..

      - name: 上傳 npm binary 套件
        uses: actions/upload-artifact@v7
        with:
          name: npm-${{ matrix.target }}
          path: dist/npm/mushroomtw-freeclaudedesktop-*-*.tgz
          if-no-files-found: error

  publish:
    name: 發布 npm 套件與 GitHub Release
    needs: build
    runs-on: ubuntu-latest
    env:
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: 下載 npm binary 套件
        uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      - name: 設定 Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: 設定 pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.15.0

      - name: 發布 npm 套件
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        shell: bash
        run: |
          for archive in dist/mushroomtw-freeclaudedesktop-*-*.tgz; do
            pnpm publish "./$archive" --access public --no-git-checks
          done
          mkdir -p dist/npm/main
          pnpm --dir packages/freeclaudedesktop pack --pack-destination ../../dist/npm/main
          pnpm publish ./dist/npm/main/*.tgz --access public --no-git-checks

      - name: 建立 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$RELEASE_VERSION" >/dev/null 2>&1; then
            echo "GitHub Release $RELEASE_VERSION 已存在，略過建立步驟"
          else
            gh release create "$RELEASE_VERSION" \
              --target "$GITHUB_SHA" \
              --title "FreeClaudeDesktop $RELEASE_VERSION" \
              --generate-notes
          fi
