name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: 檢查與測試 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: 安裝 Rust 工具鏈
        run: rustup toolchain install 1.85 --profile minimal --component rustfmt,clippy

      - name: 使用 Rust 1.85
        run: rustup override set 1.85

      - name: 檢查格式
        run: cargo fmt --all -- --check

      - name: 執行 Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: 執行測試
        run: cargo test --workspace --locked
