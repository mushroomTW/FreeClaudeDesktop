version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    # 停用一般版本更新 PR，保留安全性更新。
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      rust-dependencies:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    # 停用一般版本更新 PR，保留安全性更新。
    open-pull-requests-limit: 0
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]
