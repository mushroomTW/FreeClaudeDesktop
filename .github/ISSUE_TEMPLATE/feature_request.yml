name: Feature request
description: Suggest a new capability or improvement for FreeClaudeDesktop.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: Please describe the user need and avoid including API keys or other sensitive information.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What user problem or workflow would this improve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behavior or interface you would like to see.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Describe any workarounds or alternative approaches you have tried.
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add mockups, screenshots, links, or other context that may help.
