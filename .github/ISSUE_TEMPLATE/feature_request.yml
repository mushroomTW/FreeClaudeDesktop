name: 功能建議
description: 提出 FreeClaudeDesktop 的新功能或改善建議
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: 感謝你的想法。請描述使用情境與預期價值，避免包含任何 API Key 或個人資料。
  - type: textarea
    id: problem
    attributes:
      label: 想解決的問題
      description: 哪個使用情境目前不方便或無法完成？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建議方案
      description: 你希望產品如何運作？
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否嘗試過其他做法或工具？
  - type: textarea
    id: context
    attributes:
      label: 補充資訊
      description: 可加入 mockup、參考連結或其他背景。
