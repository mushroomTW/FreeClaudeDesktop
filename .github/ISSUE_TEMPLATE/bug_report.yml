name: Bug report
description: Report a reproducible problem with FreeClaudeDesktop.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include API keys, session cookies, full local configuration files, or other sensitive information.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Briefly describe the problem and its impact.
      placeholder: Describe what you were doing and what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide the smallest set of steps that consistently reproduces the problem.
      placeholder: |
        1. Open ...
        2. Configure ...
        3. Click ...
        4. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior and logs
      description: Describe the observed result. Add relevant logs or screenshots after removing sensitive data.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: FreeClaudeDesktop version
      placeholder: "For example: 1.0.0 or a commit SHA"
    validations:
      required: true
