[package]
name = "freeclaude-proxy"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Axum Proxy for FreeClaudeDesktop"
license = "MIT"

[dependencies]
free-claude-core = { path = "../core" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
axum = { version = "0.8", features = ["ws"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7", features = ["cors"] }
thiserror = "2"
tracing = "0.1"
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "winbase", "wincrypt", "winuser", "processthreadsapi"] }

