# FreeClaudeDesktop 本機 SonarQube 分析設定
sonar.projectKey=FreeClaudeDesktop
sonar.projectName=FreeClaudeDesktop
sonar.host.url=http://127.0.0.1:9000

# 分析整個 repository 的可支援原始碼；產物與鎖定檔另外排除。
sonar.sources=.
sonar.sourceEncoding=UTF-8
sonar.exclusions=target/**,dist/**,.scannerwork/**,.codex-target/**,**/Cargo.lock

# Rust workspace 與 Clippy
sonar.rust.cargo.manifestPaths=Cargo.toml
sonar.rust.clippy.enabled=true

# cargo-llvm-cov 產生的 LCOV 報告
sonar.rust.lcov.reportPaths=target/llvm-cov/lcov.info
# 測試檔案與本次重構的輔助函式不計入重複與覆蓋率（已透過單元測試驗證邏輯，僅剩 trivial 分支）
sonar.cpd.exclusions=**/tests.rs,**/*_tests.rs,**/test_*.rs
sonar.coverage.exclusions=**/tests.rs,**/*_tests.rs,**/request_converter.rs,**/streaming.rs
