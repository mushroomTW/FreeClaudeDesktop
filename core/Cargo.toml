[package]
name = "free-claude-core"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "Core library for FreeClaudeDesktop"
license = "MIT"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
futures = "0.3"
getrandom = "0.4"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
async-openai = { version = "0.41.1", features = ["chat-completion", "model"] }
thiserror = "2"
tracing = "0.1"
keyring = "4.1.2"
axum = { version = "0.8", features = ["ws"] }
tokio-stream = { version = "0.1", features = ["sync"] }

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "winbase", "wincrypt", "winuser", "processthreadsapi"] }
