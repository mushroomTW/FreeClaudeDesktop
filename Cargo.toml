[package]
name = "free_claude_launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "FreeClaudeLauncher"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
native-windows-gui = "1.0"
tiny_http = "0.12"
url = "2"
winapi = { version = "0.3", features = ["dpapi", "winbase", "wincrypt"] }

[build-dependencies]
winres = "0.1"
