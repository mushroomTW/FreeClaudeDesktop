[package]
name = "free_claude_launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "FreeClaudeLauncher"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iced = { version = "0.14", features = ["tokio"] }
image = { version = "0.25", default-features = false, features = ["ico"] }
tiny_http = "0.12"
url = "2"
tray-icon = "0.19"
futures = "0.3"
tokio = { version = "1", features = ["full"] }
axum = "0.7"
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.5", features = ["cors"] }
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = "4.1.2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "winbase", "wincrypt", "winuser", "processthreadsapi"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"
