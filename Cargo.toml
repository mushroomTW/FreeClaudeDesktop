[package]
name = "free_claude_launcher"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "FreeClaudeLauncher"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iced = { version = "0.14", features = ["tokio", "image", "svg"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
url = "2"
tray-icon = "0.24"
regex = "1"
futures = "0.3"
getrandom = "0.3"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = "4.1.2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "winbase", "wincrypt", "winuser", "wingdi", "processthreadsapi"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.24"
core-foundation = "0.10"

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

