[package]
name = "free_claude_launcher"
version = "0.1.0"
edition = "2021"
description = "A cross-platform Claude Desktop launcher and local API proxy"
readme = "README.md"

[[bin]]
name = "FreeClaudeLauncher"
path = "src/main.rs"

[dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
iced = { version = "0.14", features = ["tokio", "image", "svg"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
url = "2"
tray-icon = "0.24"
futures = "0.3"
getrandom = "0.3"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
axum = "0.8"
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.6", features = ["cors"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
keyring = "4.1.2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "winbase", "wincrypt", "winuser", "processthreadsapi"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winres = "0.1"

[package.metadata.deb]
section = "utils"
priority = "optional"
assets = [
    ["target/release/FreeClaudeLauncher", "usr/bin/", "755"],
    ["assets/linux/FreeClaudeLauncher.desktop", "usr/share/applications/FreeClaudeLauncher.desktop", "644"],
    ["assets/linux/freeclaudelauncher.png", "usr/share/icons/hicolor/256x256/apps/freeclaudelauncher.png", "644"],
    ["README.md", "usr/share/doc/free-claude-launcher/README.md", "644"],
    ["README_zh.md", "usr/share/doc/free-claude-launcher/README_zh.md", "644"],
]

[package.metadata.wix]
eula = false
