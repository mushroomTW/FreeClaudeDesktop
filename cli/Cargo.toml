[package]
name = "freeclaude"
version = "0.1.1"
edition = "2024"
rust-version = "1.85"
description = "CLI for FreeClaudeDesktop"
license = "MIT"

[dependencies]
free-claude-core = { path = "../core" }
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
tokio-tungstenite = "0.29"
thiserror = "2"
tracing = "0.1"
futures = "0.3"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
url = "2"

[target.'cfg(target_os = "windows")'.dependencies]
winapi = { version = "0.3", features = ["dpapi", "winbase", "wincrypt", "winuser", "processthreadsapi"] }
