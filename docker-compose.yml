services:
  freeclaude-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: freeclaude-proxy:local
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped
    volumes:
      - freeclaude-settings:/home/freeclaude/.config/FreeClaudeDesktop

volumes:
  freeclaude-settings:
